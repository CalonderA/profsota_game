<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СОТА — Шахта Знаний</title>
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #111827 0%, #07090e 80%);
      color: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 32px 28px;
      border-radius: 20px;
      max-width: 440px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .hex-logo { width: 64px; height: 72px; }
    h1 { font-size: 22px; font-weight: 800; margin: 0; color: #ffffff; }
    p { color: #94a3b8; font-size: 14px; margin: 0; line-height: 1.5; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #38bdf8; text-decoration: none; font-weight: 600; font-size: 13.5px; }
    a:hover { text-decoration: underline; }
  </style>
  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);
      const spec = (params.get('spec') || '').toLowerCase();
      let target = 'menu.html';
      if (['kip', 'ts', 'e', 'reu', 'p', 'ksk'].includes(spec)) {
        target = 'specialties/' + spec + '/index.html';
      }
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="card">
    <svg class="hex-logo" viewBox="0 0 240 280">
      <polygon points="44,52 104,52 134,104 104,156 44,156 14,104" fill="#0082d4" />
      <polygon points="139,106 199,106 229,158 199,210 139,210 109,158" fill="#d3122a" />
      <polygon points="44,160 104,160 134,212 104,264 44,264 14,212" fill="#71717a" />
      <polygon points="89,131 104,104 134,104 149,131 134,158 104,158" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
    </svg>
    <h1>Шахта Знаний · СОТА</h1>
    <div class="spinner"></div>
    <p>Загрузка симулятора производственной практики...</p>
    <a href="menu.html">Перейти в главное меню вручную →</a>
  </div>
</body>
</html>
